name: CI-CD

on:
  push:
    branches:
      - "ci-cd"

env:
  REGION: asia-northeast3
  GCE_INSTANCE_ZONE: asia-northeast3-a
  GCE_INSTANCE: production-server
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE: web-server
  CONTAINER_PORT: "3333"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$IMAGE:$GITHUB_SHA" \
            -f Dockerfile \
            .

      - name: Docker push
        run: |
          docker push "$DOCKERHUB_USERNAME/$IMAGE:$GITHUB_SHA"
  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0.6.0
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to GCE
        run: |
          # 기존 컨테이너 제거
          gcloud compute ssh "$GCE_INSTANCE" --zone "$GCE_INSTANCE_ZONE" --command "
          sudo docker rm -f web-server || true
          "
    
          # 새 컨테이너 실행
          gcloud compute ssh "$GCE_INSTANCE" --zone "$GCE_INSTANCE_ZONE" --command "
          sudo docker run -d \
          -p $CONTAINER_PORT:$CONTAINER_PORT \
          --name web-server \
          --env-file /home/jjeongbin0826/.env \
          -v /home/jjeongbin0826/google_application_credentials.json:/app/google_application_credentials.json:ro \
          $DOCKERHUB_USERNAME/$IMAGE:$GITHUB_SHA